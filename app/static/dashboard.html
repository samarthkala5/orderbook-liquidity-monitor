<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orderbook Liquidity Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; }
        .tab { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
        .card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
        .card-val { font-size: 1.6rem; font-weight: 700; margin-top: 5px; color: var(--accent); }
        .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; height: 350px; }
        .sub-text { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
        a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 style="margin: 0; font-size: 1.5rem;">Orderbook Liquidity Monitor</h1>
                <div class="sub-text">API Schema available at <a href="/docs">/docs</a></div>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="setSymbol('BTC')">BTC</button>
                <button class="tab" onclick="setSymbol('ETH')">ETH</button>
                <button class="tab" onclick="setSymbol('SOL')">SOL</button>
            </div>
        </header>

        <div class="grid" id="kpi-grid">
            <div class="card"><div class="card-title">Binance Spread</div><div class="card-val" id="binance-spread">-- bps</div></div>
            <div class="card"><div class="card-title">Coinbase Spread</div><div class="card-val" id="coinbase-spread">-- bps</div></div>
            <div class="card"><div class="card-title">Binance $10k Buy Slip</div><div class="card-val" id="binance-slip">-- bps</div></div>
            <div class="card"><div class="card-title">Coinbase $10k Buy Slip</div><div class="card-val" id="coinbase-slip">-- bps</div></div>
        </div>

        <div class="chart-box">
            <canvas id="spreadChart"></canvas>
        </div>
    </div>

    <script>
        let currentSymbol = 'BTC';
        let chart;

        function setSymbol(sym) {
            currentSymbol = sym;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.innerText === sym));
            refresh();
        }

        async function fetchCompare() {
    try {
        const res = await fetch(`/compare/${currentSymbol}`);
        if (!res.ok) return;
        const data = await res.json();
        const binance = data.exchanges.find(e => e.exchange === 'binance');
        const coinbase = data.exchanges.find(e => e.exchange === 'coinbase');

        if (binance) {
            document.getElementById('binance-spread').innerText = binance.spread_bps.toFixed(4) + ' bps';
            document.getElementById('binance-slip').innerText = binance.slip_buy_10k_bps !== null ? binance.slip_buy_10k_bps.toFixed(4) + ' bps' : 'N/A';
        }
        if (coinbase) {
            document.getElementById('coinbase-spread').innerText = coinbase.spread_bps.toFixed(4) + ' bps';
            document.getElementById('coinbase-slip').innerText = coinbase.slip_buy_10k_bps !== null ? coinbase.slip_buy_10k_bps.toFixed(4) + ' bps' : 'N/A';
        }
    } catch (e) { console.error("Compare error", e); }
}

        async function fetchHistory() {
            try {
                const [bRes, cRes] = await Promise.all([
                    fetch(`/history/binance/${currentSymbol}?minutes=60&limit=60`),
                    fetch(`/history/coinbase/${currentSymbol}?minutes=60&limit=60`)
                ]);
                const bData = bRes.ok ? await bRes.json() : [];
                const cData = cRes.ok ? await cRes.json() : [];

                const labels = bData.map(r => new Date(r.ts_utc).toLocaleTimeString()).reverse();
                const bSpreads = bData.map(r => r.spread_bps).reverse();
                const cSpreads = cData.map(r => r.spread_bps).reverse();

                updateChart(labels, bSpreads, cSpreads);
            } catch (e) { console.error("History error", e); }
        }

        function updateChart(labels, binanceData, coinbaseData) {
            const ctx = document.getElementById('spreadChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Binance Spread (bps)', data: binanceData, borderColor: '#f0b90b', tension: 0.1 },
                        { label: 'Coinbase Spread (bps)', data: coinbaseData, borderColor: '#0052ff', tension: 0.1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });
        }

        function refresh() {
            fetchCompare();
            fetchHistory();
        }

        refresh();
        setInterval(refresh, 10000);
    </script>
</body>
</html>
